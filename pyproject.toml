[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-customer-intelligence-lab"
version = "1.0.0"
description = "Reproducible CRM analytics research pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Muhammad Haider Ali"}]
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.scripts]
crm-lab = "crm_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
